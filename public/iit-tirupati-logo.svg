<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 84" width="100%" height="100%">
  <!-- Left Emblem: IIT Tirupati Navavishkar Leaf & Circle Symbol -->
  <g transform="translate(4, 0)">
    <!-- Golden Leaf / Almond Outer Contour -->
    <path
      d="M 32 5 C 13 20 6 36 6 42 C 6 48 13 64 32 79 C 51 64 58 48 58 42 C 58 36 51 20 32 5 Z"
      fill="#D4AF6E"
    />

    <!-- Inner Crimson Maroon Disc -->
    <circle cx="32" cy="42" r="22" fill="#8B1B29" />

    <!-- Thin Gold Crosshair Dividing Lines -->
    <line x1="10" y1="42" x2="54" y2="42" stroke="#D4AF6E" stroke-width="1.8" />
    <line x1="32" y1="20" x2="32" y2="64" stroke="#D4AF6E" stroke-width="1.8" />

    <!-- Dark Inner Crescent / Core -->
    <circle cx="30" cy="44" r="12" fill="#1C090D" />

    <!-- White 8-pointed star / rosette in upper-right quadrant -->
    <g transform="translate(40.5, 33.5) scale(0.72)">
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
      <path
        d="M 0 -7 L 1.6 -2.4 L 6.2 -3.8 L 3.2 0 L 6.2 3.8 L 1.6 2.4 L 0 7 L -1.6 2.4 L -6.2 3.8 L -3.2 0 L -6.2 -3.8 L -1.6 -2.4 Z"
        fill="#FFFFFF"
      />
    </g>
  </g>

  <!-- Right Typography: Pristine, Perfectly Aligned for Dark Backgrounds -->
  <!-- Line 1: IIT Tirupati -->
  <text
    x="74"
    y="26"
    fill="#F1F5F9"
    font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="16.5"
    font-weight="400"
    letter-spacing="0.3"
  >IIT Tirupati</text>

  <!-- Line 2: Navavishkār (Bold with macron ā) -->
  <text
    x="74"
    y="51"
    fill="#FFFFFF"
    font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="21.5"
    font-weight="800"
    letter-spacing="-0.3"
  >Navavishk&#x101;r</text>

  <!-- Line 3: I-Hub Foundation -->
  <text
    x="74"
    y="73"
    fill="#E2E8F0"
    font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="15.5"
    font-weight="400"
    letter-spacing="0.4"
  >I-Hub Foundation</text>
</svg>